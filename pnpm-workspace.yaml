packages:
  - packages/*
  - apps/*
  - scripts
  - e2e
minimumReleaseAgeExclude:
  - '@eslint/config-array@0.23.6'
  - eslint@10.15.0

# Install scripts: esbuild (used by tsx) only. The native add-ons below have pure-JS fallbacks.
allowBuilds:
  esbuild: true
  bigint-buffer: false
  bufferutil: false
  utf-8-validate: false
